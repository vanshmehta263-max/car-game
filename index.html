<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic Car Parking Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="game">
    <header class="topbar">
      <div>
        <h1>CAR PARKING <span>SIMULATOR</span></h1>
        <p>Precision driving challenge</p>
      </div>
      <div class="stats">
        <div><small>LEVEL</small><strong id="level">01</strong></div>
        <div><small>SPEED</small><strong id="speed">0 km/h</strong></div>
        <div><small>TIME</small><strong id="timer">00:00</strong></div>
      </div>
    </header>

    <main class="game-area">
      <canvas id="gameCanvas" width="1000" height="650"></canvas>

      <div class="message" id="message">
        <h2>READY TO PARK?</h2>
        <p>Drive carefully into the highlighted parking space.</p>
        <button id="startBtn">START GAME</button>
      </div>

      <div class="hud">
        <div class="gear" id="gear">D</div>
        <div class="damage">
          <span>CAR CONDITION</span>
          <div class="health-track">
            <div id="healthBar"></div>
          </div>
        </div>
      </div>
    </main>

    <section class="controls">
      <div class="keyboard-help">
        <strong>KEYBOARD CONTROLS</strong>
        <p>W / ↑ Accelerate &nbsp; S / ↓ Brake / Reverse</p>
        <p>A / ← Steer Left &nbsp; D / → Steer Right</p>
        <p>Space: Handbrake &nbsp; R: Restart</p>
      </div>

      <div class="mobile-controls">
        <div class="steering">
          <button data-control="left">◀</button>
          <button data-control="right">▶</button>
        </div>
        <div class="pedals">
          <button data-control="brake" class="brake">BRAKE</button>
          <button data-control="gas" class="gas">GAS</button>
        </div>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
